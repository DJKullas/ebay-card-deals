name: Scan eBay card deals

on:
  schedule:
    # Every 10 minutes. Keep in sync with schedule.scanIntervalMinutes in
    # config/scan.config.js (test/config.test.js fails if they drift).
    # Note: GitHub cron ticks are often several minutes late, which is why the
    # scan window is interval + buffer.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no notifications, no dedupe writes)'
        type: boolean
        default: false
      verbose:
        description: 'Log every listing evaluated'
        type: boolean
        default: true

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Persist state/ (dedupe + price cache) between runs. Each run writes a
      # new cache entry and restores the most recent one.
      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: scan-state-${{ github.run_id }}
          restore-keys: |
            scan-state-

      - name: Scan
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          SPORTSCARDSPRO_TOKEN: ${{ secrets.SPORTSCARDSPRO_TOKEN }}
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          node src/index.js
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.verbose == true && '--verbose' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: scan-state-${{ github.run_id }}
