name: Scan eBay card deals

# One long-running job scans every schedule.scanIntervalMinutes (15) for
# schedule.loopMinutes (~5.7h), then exits so its state cache can be saved.
# GitHub's cron scheduler is far too erratic for a 15-minute schedule (it fired
# a "*/15" cron 6 times in 14 hours), which is why the loop lives in the process.
#
# The cron launches a replacement every 3 hours — deliberately more often than
# the job lasts. The concurrency group holds the newcomer in "pending" until the
# running job exits, so coverage is seamless even when a cron tick is skipped or
# hours late. Only one job ever runs at a time, so this costs no extra minutes.
on:
  schedule:
    # Keep in sync with schedule.launchEveryHours in config/scan.config.js
    # (test/config.test.js fails if they drift).
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Keep scanning every 15 min for this many minutes (0 = one scan and exit)'
        type: number
        default: 0
      dry_run:
        description: 'Dry run (no notifications, no dedupe writes)'
        type: boolean
        default: false
      verbose:
        description: 'Log every listing evaluated'
        type: boolean
        default: true

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # loopMinutes (340) + one last scan (maxRunSeconds) must fit; GitHub kills at 360.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Persist state/ (dedupe + price cache) between jobs. Each job writes a
      # new cache entry and restores the most recent one.
      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: scan-state-${{ github.run_id }}
          restore-keys: |
            scan-state-

      - name: Scan
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          SPORTSCARDSPRO_TOKEN: ${{ secrets.SPORTSCARDSPRO_TOKEN }}
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # schedule → --loop (config.schedule.loopMinutes); manual → --loop N only if asked.
        run: >
          node src/index.js
          ${{ github.event_name == 'schedule' && '--loop' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && inputs.loop_minutes > 0 && format('--loop {0}', inputs.loop_minutes) || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.verbose == true && '--verbose' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: scan-state-${{ github.run_id }}
